<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D061"/>
      <stop offset="50%" stop-color="#E5A93C"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1F1B12"/>
      <stop offset="100%" stop-color="#0A0805"/>
    </radialGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bg)" stroke="url(#gold)" stroke-width="14"/>

  <!-- Inner Gold Border Ring -->
  <circle cx="256" cy="256" r="214" fill="none" stroke="url(#gold)" stroke-width="3" stroke-dasharray="8,6" opacity="0.75"/>

  <!-- Decorative Crown Top Crest -->
  <path d="M 256 95 L 275 125 L 256 120 L 237 125 Z" fill="url(#gold)" />
  <circle cx="256" cy="80" r="9" fill="url(#gold)"/>
  <circle cx="214" cy="98" r="6" fill="url(#gold)"/>
  <circle cx="298" cy="98" r="6" fill="url(#gold)"/>

  <!-- Elegant Monogram GI -->
  <text x="256" y="325" 
        font-family="'Cinzel', 'Georgia', 'Times New Roman', serif" 
        font-size="205" 
        font-weight="bold" 
        fill="url(#gold)" 
        text-anchor="middle" 
        letter-spacing="2">GI</text>

  <!-- Bottom Accent Star -->
  <polygon points="256,380 261,392 274,392 263,400 267,412 256,404 245,412 249,400 238,392 251,392" fill="url(#gold)"/>
</svg>
