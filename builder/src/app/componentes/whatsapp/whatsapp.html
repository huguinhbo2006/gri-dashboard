<div class="card p-3 my-3 position-relative border-primary border-2">
  <div class="d-flex justify-content-between align-items-center mb-2">
    <span class="badge bg-secondary">Componente: Whatsapp</span>
    <div class="d-flex gap-2">
      <button class="btn btn-sm btn-outline-primary" (click)="abrirConfig()">⚙ Configurar</button>
      <button class="btn btn-sm btn-outline-danger" (click)="eliminar()">✖ Eliminar</button>
    </div>
  </div>

  <div class="border rounded p-3 bg-light">
    <h5>Visualización en Builder: <strong>{{ titulo || 'whatsapp' }}</strong></h5>
    <p class="text-muted small">Props configuradas:</p>
    <ul>
      <li><strong>telefono:</strong> {{ telefono }}</li>
      <li><strong>mensajePredefinido:</strong> {{ mensajePredefinido }}</li>
    </ul>
  </div>

  <!-- Modal Config -->
  <div *ngIf="mostrarConfig" class="modal d-block" style="background: rgba(0,0,0,0.5);" (click)="cerrarConfig()">
    <div class="modal-dialog modal-dialog-centered" (click)="$event.stopPropagation()">
      <div class="modal-content text-dark">
        <div class="modal-header">
          <h5 class="modal-title">Configurar Whatsapp</h5>
          <button type="button" class="btn-close" (click)="cerrarConfig()"></button>
        </div>
        <div class="modal-body" style="max-height: 450px; overflow-y: auto;">
          <div class="mb-3">
            <label class="form-label">Número de WhatsApp (con código de país)</label>
            <input type="text" class="form-control" [(ngModel)]="telefono" (ngModelChange)="onPropsChange()">
          </div>
          <div class="mb-3">
            <label class="form-label">Mensaje Predefinido</label>
            <input type="text" class="form-control" [(ngModel)]="mensajePredefinido" (ngModelChange)="onPropsChange()">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-primary" (click)="cerrarConfig()">Listo</button>
        </div>
      </div>
    </div>
  </div>
</div>
