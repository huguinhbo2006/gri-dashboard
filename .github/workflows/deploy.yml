name: Deploy Builder (Angular CMS Editor) to Hostinger

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-deploy:
    name: Build & Deploy Builder CMS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Build Production Bundle
        run: npm run build:prod

      - name: Package Browser Build Contents
        run: |
          cd dist/builder/browser
          tar -czf /tmp/builder-dist.tar.gz .
          mv /tmp/builder-dist.tar.gz ../../../builder-dist.tar.gz

      - name: Ensure Target Directory Exists on Hostinger
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST || '195.35.39.62' }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || '65002' }}
          username: ${{ secrets.HOSTINGER_SSH_USER || 'u111559603' }}
          key: ${{ secrets.HOSTINGER_SSH_KEY || secrets.SSH_KEY }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          script: |
            TARGET="${{ secrets.BUILDER_TARGET_DIR || '/home/u111559603/domains/tudominio.com/public_html/builder' }}"
            mkdir -p "$TARGET"

      - name: Upload Package Archive via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST || '195.35.39.62' }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || '65002' }}
          username: ${{ secrets.HOSTINGER_SSH_USER || 'u111559603' }}
          key: ${{ secrets.HOSTINGER_SSH_KEY || secrets.SSH_KEY }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          source: "builder-dist.tar.gz"
          target: "${{ secrets.BUILDER_TARGET_DIR || '/home/u111559603/domains/tudominio.com/public_html/builder' }}"
          timeout: 120s

      - name: Extract Build Package on Hostinger
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST || '195.35.39.62' }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || '65002' }}
          username: ${{ secrets.HOSTINGER_SSH_USER || 'u111559603' }}
          key: ${{ secrets.HOSTINGER_SSH_KEY || secrets.SSH_KEY }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          script: |
            TARGET="${{ secrets.BUILDER_TARGET_DIR || '/home/u111559603/domains/tudominio.com/public_html/builder' }}"
            cd "$TARGET"
            tar -xzf builder-dist.tar.gz
            rm -f builder-dist.tar.gz
            echo "✅ ¡Builder CMS desplegado con éxito en $TARGET!"
